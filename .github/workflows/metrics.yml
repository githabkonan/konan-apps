name: metrics
on:
  schedule:
    # 毎日 JST 23:10(=UTC 14:10)= 当日の投稿が出そろった後に1回だけ集計
    - cron: '10 14 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yt-dlp
        run: pip install -q yt-dlp
      - name: Collect metrics
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 automation/metrics_cloud.py
      - name: Competitor watch (RUMAHSAKU等・トークン0)
        if: always()
        run: python3 automation/competitor_watch.py
      - name: Commit metrics log
        if: always()
        run: |
          git config user.name "Chokobi Sakusaku"
          git config user.email "konakonan822@gmail.com"
          git add automation/metrics_log.jsonl automation/competitor_state.json automation/competitor_alerts.md || true
          git diff --cached --quiet || (git commit -m "chore: daily metrics" && git pull --rebase && git push)
