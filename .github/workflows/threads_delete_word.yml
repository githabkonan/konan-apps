name: threads_delete_word
# 2026-10-24 konan 承認: 旧アプリ名「英語脳トレーナー」入りで出た投稿を削除する。dry_run=true なら一覧のみ。
on:
  workflow_dispatch:
    inputs:
      word: { description: "本文に含む語", default: "英語脳トレーナー" }
      dry_run: { description: "true=一覧のみ / false=削除", default: "true" }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: delete
        env:
          UID: ${{ secrets.NOTE_THREADS_USER_ID }}
          TOK: ${{ secrets.NOTE_THREADS_ACCESS_TOKEN }}
          WORD: ${{ github.event.inputs.word }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          uid, tok, w, dry = os.environ["UID"], os.environ["TOK"], os.environ["WORD"], os.environ["DRY"] != "false"
          base = "https://graph.threads.net/v1.0"
          url = f"{base}/{uid}/threads?" + urllib.parse.urlencode({"fields":"id,text,timestamp","limit":100,"access_token":tok})
          hits = []
          for _ in range(5):
              d = json.load(urllib.request.urlopen(url, timeout=60))
              hits += [p for p in d.get("data", []) if w in (p.get("text") or "")]
              url = d.get("paging", {}).get("next")
              if not url: break
          print(f"該当 {len(hits)} 件 dry_run={dry}")
          for p in hits:
              print(" ", p["timestamp"], p["id"], p["text"][-60:].replace("\n", " "))
              if not dry:
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(f"{base}/{p['id']}?access_token={tok}", method="DELETE"), timeout=60)
                      print("   削除", r.read().decode()[:60])
                  except urllib.error.HTTPError as e:
                      print("   失敗", e.code, e.read().decode()[:300])
          PY
