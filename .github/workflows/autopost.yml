name: autopost
on:
  schedule:
    # 毎時 JST 6:00-23:00(=UTC 21-23,0-14)= 18回/日。IG 25投稿/24h上限内・Threadsはテキストで安全に高頻度。
    - cron: '0 0-14,21-23 * * *'
  workflow_dispatch: {}
concurrency:
  group: autopost
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ffmpeg (narration gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Narration gate (ナレ無し動画は配信ライン全停止)
        run: python3 automation/video_preflight.py
      - name: Post to IG + Threads
        env:
          # 【2026-07-29 復旧】IGが Media Publish Limit Exceeded で全失敗したため安全側へ戻す。48h→72h
          REPOST_COOLDOWN_H: "72"
          # 【2026-07-29】IG本数はクォータAPI実測で自動決定(勘で決めない)。上限に安全余白5を残して埋める=ギリギリを攻める
          # クォータ実測で自動調整するため上限だけ与える(実際の本数は content_publishing_limit の残枠で決まる)
          # 【2026-08-06】本数はcloud_post.py側の時間帯戦略が決める(空=自動)
          IG_SAFETY_MARGIN: "5"

          # YT実測間隔が~2hに伸び9本/日未達だったため95→75分(2026-07-27)。ランが毎時来る前提で日9本を確実に
          YT_MIN_GAP_MIN: "75"
          # 2026-07-27 konan指示: YT頻度引き上げ 9→12本/日(在庫は同日+10本増産で担保)
          YT_MAX_PER_DAY: "12"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 automation/cloud_post.py
      - name: Persist state (YT dedup)
        if: always()
        run: |
          git config user.name "Chokobi Sakusaku"
          git config user.email "konakonan822@gmail.com"
          git add automation/state.json || true
          git diff --cached --quiet || (git commit -m "chore: autopost state" && git pull --rebase && git push)
