name: autopost
on:
  schedule:
    # 【2026-08-22 konan「スレッドは24時間で240本出す設計にしろ」】毎時24回/日へ。
    # 深夜帯に増えるのは Threads だけ: IG は _per_run_default() が窓外で0本、
    # YouTube は YT_WIN_START/END(6-23)で守られているので、この変更では動かない。
    # 【2026-08-29】毎時 :00 は GitHub 側が最も混む分で、実測 8/28 は 17:24〜翌 05:34 の
    # 12時間スケジュールが一度も発火しなかった(Threads の21時枠を2日連続で失った)。
    # 混まない分に移し、1時間に2回入れて取りこぼしを減らす。
    # 各チャンネルの本数は「その日の目標に対する不足分」で決まる(IG=_ig_slot_target,
    # YT=_behind, Threads=枠)ので、ラン数を増やしても1日の投稿本数は増えない。
    - cron: '17,47 * * * *'
  workflow_dispatch: {}
concurrency:
  group: autopost
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    # 2026-08-20: ハング1本が3時間渋滞を作った(F記録)。時間で自動killして後続を通す。
    # 2026-08-22: IGを1日100本(毎時4〜5本)にしたので、Reelの変換待ち(1本最大4分)を織り込んで延長。
    # cron は毎時なので、45分までなら次のランを追い越さない。
    timeout-minutes: 40
    steps:
      # 【2026-08-13】ref を明示しないと**発火した時点の SHA** を取りに行く。concurrency で
      # 順番待ちにされた2本目は、1本目が state.json を更新し終えた後に走るのに古い state を読み、
      # 同じ動画をもう一度上げる。実際 8/13 に同じ動画が5分差で2本公開された。
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ffmpeg (narration gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Narration gate (ナレ無し動画を隔離・他は流す)
        run: python3 automation/video_preflight.py
      # 【F-409】有料アプリを「無料」と紹介する投稿を配信ラインで止める(価格はApp Storeに実照会)
      - name: Truth gate (価格の嘘・必須キー)
        run: python3 automation/queue_lint.py
      - name: Post to IG + Threads
        env:
          # 【2026-07-29 復旧】IGが Media Publish Limit Exceeded で全失敗したため安全側へ戻す。48h→72h
          # 【2026-08-22】IGを100本/日にしたので72hだと枯れる(100×3日=300枠に対し在庫354本で余裕が無い)。
          # 48hなら100×2日=200枠で在庫354に対し十分。この値は今は IG だけに効く
          # (Threadsは THREADS_COOLDOWN_H=18、YouTubeは yt_posted の重複排除で管理)。
          REPOST_COOLDOWN_H: "48"
          # 【2026-07-29】IG本数はクォータAPI実測で自動決定(勘で決めない)。上限に安全余白5を残して埋める=ギリギリを攻める
          # クォータ実測で自動調整するため上限だけ与える(実際の本数は content_publishing_limit の残枠で決まる)
          # 【2026-08-06】本数はcloud_post.py側の時間帯戦略が決める(空=自動)
          IG_SAFETY_MARGIN: "5"
          # 【2026-08-22 konan指示】「インスタも100本上限なら24時間で100本出す設計にしろ。
          # もちろんトラブルあった場合、元取ろうとしてスパム投稿はするな」。
          # 公式上限は100投稿/24時間の移動窓(content_publishing_limit で実測。Metaの解説ページは
          # 50のままで古い)。毎時4〜5本へ均等に割り、遅れは取り戻さない(落ちたランのぶんは捨てる)。
          # 実際の天井は cloud_post.py の ig_quota() が毎回APIに聞いて余白5を残して守る。
          IG_MAX_PER_DAY: "2"    # v4(2026-08-26): 最適投稿数

          # 2026-07-27 konan指示: YT頻度引き上げ 9→12本/日(在庫は同日+10本増産で担保)
          # 【2026-08-09】一時的に6へ絞ったが konan 指示で撤回。「絞るのではなく充填しろ」。
          # 供給不足は本数を落として凌ぐのではなく増産で埋める(残枠17%で回すと判断)。
          YT_MAX_PER_DAY: "2"    # v4(2026-08-26): 最適投稿数(旧24は量産自滅路線)
          # 【F-410・2026-08-07】固定間隔(75分)は廃止。GitHub cron は毎時のはずが実測7/11回しか
          # 発火せず、1ラン1本しか上げない設計と噛み合って実績5本/12本だった。
          # 今はペース追従で、遅れていれば1ランで最大この本数まで取り戻す。
          YT_CATCHUP_MAX: "4"    # 24本/日をランの間引き込みで消化するため挽回幅も微増
          # 【2026-08-13 再開】停止理由は「テキスト+App Storeリンクの使い回し」だった(F-412)。
          # media_type=VIDEO で動画本体を投げ、本文からリンクを外した(誘導は動画の最終シーンが担う)。
          # 削除が出ないことを確認するまで1日6本に絞る。安全なら上げる。
          # 【2026-08-22】6本で9日間(8/13〜8/21)回して削除ゼロ。公式上限は250投稿/24h
          # (threads_publishing_limit で実測)なので、6も12も上限とは無関係に遅かった。24本へ。
          # cloud_post.py 側は 8/15 に既定12本+時間比例の段階解禁へ直していたのに、
          # **この env が 6 のまま勝ち続けていた**ので「ペースが遅い」指摘が解消しなかった。
          # コードの既定値と設定ファイルが食い違うと、必ず設定ファイルが勝つ。両方直すこと。
          # 実際の天井は cloud_post.py が threads_publishing_limit を毎回叩いて守る。
          # 【2026-08-22 konan指示】240本/24時間。公式上限250の枠内で、残枠はAPI実測で毎回確認する。
          # 本数を上げる前提条件は「毎回言い回しが変わること」= automation/threads_variants.json。
          # これが空だと同型連投になり F-412 を再発させるので、増やす時は必ず作り置きを確認する。
          # 【2026-08-22 09:40 切替】作り置きが 250投稿ぶん・1243通り 揃ったので 240 へ。
          # 作り置きの無い86投稿は cloud_post.py の pick() が後回しにする(全部埋まった時だけ使う)。
          # 【2026-08-26 v4】本数は「1本あたりが伸びる数」で決める(Threads=2〜3本/日)。
          # API上限(250投稿/24h)は別の話で、余っていることは増やす根拠にならない
          # (2026-08-30 に6へ上げて konan 差し戻し)。枠数と日次上限は必ず同じ数字にする
          THREADS_MAX_PER_DAY: "3"
          THREADS_DAILY_SLOTS: "3"   # さくさく(アプリ)=7/19/21時。note枠(12時)は別勘定
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # note集客は別アカ @sakuttotyokobi。未設定なら note枠は作られない(さくさくには絶対に出さない)
          # 【2026-08-30 konan指示】「ノート投稿も1日1投稿毎日昼の12:00ね。他のアプリ宣伝の
          # スレッドとは全くの別だから」。12時は さくさくの候補から自動で外れる(TH_ACTIVE_HOURS)
          NOTE_THREADS_HOUR: "12"
          NOTE_THREADS_USER_ID: ${{ secrets.NOTE_THREADS_USER_ID }}
          NOTE_THREADS_ACCESS_TOKEN: ${{ secrets.NOTE_THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 automation/cloud_post.py
      # 【2026-08-08】以前は `git pull --rebase` で、こちらが同時にpushしていると
      # "could not apply ... chore: autopost state" で落ち、**投稿は成功しているのに state だけ消える**
      # (=72hクールダウンの記録が飛ぶ)事故が起きた。競合しても取りこぼさないよう意味を分かって合流させる。
      - name: Persist state (YT dedup)
        if: always()
        run: |
          git config user.name "Chokobi Sakusaku"
          git config user.email "konakonan822@gmail.com"
          # 【F-442】このランが書いた state を退避。リトライ時の reset --hard で作業ツリーの
          # state.json が origin の古い版に戻り、ランの投稿記録ごと消えていた(=次のランが同じ枠を再投稿)。
          cp automation/state.json /tmp/run_state.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git show origin/main:automation/state.json > /tmp/remote_state.json 2>/dev/null || echo '{}' > /tmp/remote_state.json
            cp /tmp/run_state.json automation/state.json
            python3 automation/merge_state.py /tmp/remote_state.json
            git add automation/state.json
            git diff --cached --quiet && { echo "state 変化なし"; exit 0; }
            git commit -m "chore: autopost state"
            git reset --hard HEAD >/dev/null
            git rebase origin/main -X ours >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1
            if git push origin HEAD:main; then echo "state 保存OK"; exit 0; fi
            echo "push 競合 — 合流し直して再試行 ($i/5)"
            git reset --hard origin/main >/dev/null
            sleep 5
          done
          echo "WARN state を保存できなかった(投稿自体は完了している)"
