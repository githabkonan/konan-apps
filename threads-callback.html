<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorization complete — social-autopost</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif; color:#1a1a1a; background:#fff; line-height:1.7; }
  .wrap { max-width:640px; margin:0 auto; padding:72px 24px; }
  h1 { font-size:24px; margin:0 0 12px; letter-spacing:-.02em; }
  p { color:#5b6470; }
  code { background:#f4f5f7; padding:2px 6px; border-radius:5px; font-size:13px; word-break:break-all; }
  a { color:#c8102e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Authorization complete</h1>
  <p>You can close this window and return to the application. The authorization code is contained in this page's address bar.</p>
  <p id="c"></p>
  <p><a href="social-autopost/index.html">About social-autopost</a> &middot; <a href="social-autopost/privacy.html">Privacy Policy</a></p>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var el = document.getElementById('c');
  if (p.get('code')) { el.textContent = 'Code received.'; }
  else if (p.get('error')) { el.textContent = 'Error: ' + (p.get('error_description') || p.get('error')); }
</script>
</body>
</html>
